name: e2e

# Runs scenarios by hand, each in its own job, in parallel. scenarios picks
# some by name; empty runs every scenario: airgap, install, install-kvm,
# restore and each scenario of e2e/features. airgap checks the nodes, the
# controller and the fill, install installs k3s and every chart of helm/ on
# empty nodes with ansible/install.yml, and install-kvm does the same on
# three VMs with SELinux enforcing, under the runner's KVM. Every other
# scenario starts a clean k3s cluster from the cache and deploys the charts
# with ansible/upgrade.yml: restore checks just that, and each scenario of
# e2e/features then runs its lines and always.feature. First, the images job
# publishes the images of e2e/images that the packages do not have yet. The
# cache job builds and publishes the cache when the packages do not have
# it; only the scenarios that start from it wait for it. Each scenario job
# uploads the run's files, also when its scenario failed.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario names, separated by commas; empty for every scenario
        type: string
        default: ""

run-name: e2e${{ inputs.scenarios && format(' of {0}', inputs.scenarios) || '' }}

permissions:
  contents: read

jobs:
  plan:
    name: Pick the scenarios
    runs-on: ubuntu-24.04
    outputs:
      fresh: ${{ steps.pick.outputs.fresh }}
      cached: ${{ steps.pick.outputs.cached }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        env:
          WANTED: ${{ inputs.scenarios }}
        run: |
          set -euo pipefail
          if [[ -n $WANTED ]]; then
            picked=$(tr -s ', ' '\n' <<<"$WANTED" | sed '/^$/d' | sort -u)
          else
            picked=$({
              printf '%s\n' airgap install install-kvm restore
              grep -ho '^ *@[a-z0-9-]*' e2e/features/*.feature | tr -d ' @' | grep -vx always
            } | sort -u)
          fi
          # Those that start from new machines; every other one starts from
          # the cache.
          new='airgap|install|install-kvm'
          json() { jq -Rnc '[inputs | select(length > 0)]'; }
          fresh=$({ grep -xE "$new" <<<"$picked" || true; } | json)
          cached=$({ grep -vxE "$new" <<<"$picked" || true; } | json)
          echo "From new machines: $fresh; from the cache: $cached"
          echo "fresh=$fresh" >>"$GITHUB_OUTPUT"
          echo "cached=$cached" >>"$GITHUB_OUTPUT"

  images:
    name: Publish the images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Build and push the missing images
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          go -C e2e run ./cmd/images

  # One cache publisher at a time, across branches: a second one waits,
  # then finds the cache the first pushed under the same tag.
  cache:
    name: Publish the cache
    needs: [plan, images]
    if: needs.plan.outputs.cached != '[]'
    concurrency:
      group: e2e-cache
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: Build and push the cache when it is missing
        run: go -C e2e test -run '^TestScenario$' -count=1 -timeout 50m -v . -scenario cache -push

  fresh:
    name: ${{ matrix.scenario }}
    needs: [plan, images]
    if: needs.plan.outputs.fresh != '[]'
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.fresh) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: go -C e2e test -run '^TestScenario$' -count=1 -timeout 90m -v . -scenario "$SCENARIO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.scenario }}
          path: results/
          if-no-files-found: error

  # These pull the cache the cache job published: -no-build.
  cached:
    name: ${{ matrix.scenario }}
    needs: [plan, cache]
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.cached) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: go -C e2e test -run '^TestScenario$' -count=1 -timeout 90m -v . -scenario "$SCENARIO" -no-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.scenario }}
          path: results/
          if-no-files-found: error
