name: e2e

# Every scenario in its own job, on pull requests, nightly and by hand. A
# push to main saves the cache of its commit. The nightly first copies the
# newest images and charts with cmd/mirror -latest, runs every scenario on
# that versions file, and releases it with report.yaml.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario names, separated by spaces; empty for every scenario
        type: string
        default: ""
      nightly:
        description: Run as the nightly
        type: boolean
        default: false

run-name: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || github.event_name == 'push' && 'cache' || 'e2e' }}

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cache:
    if: github.event_name == 'push' || inputs.scenarios == 'cache'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - run: go run ./e2e -push install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: install
          path: results/
          if-no-files-found: error

  plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: list
        env:
          SCENARIOS: ${{ !inputs.nightly && inputs.scenarios || '' }}
        # Unquoted, so each name is an argument.
        run: echo "scenarios=$(go run ./e2e list $SCENARIOS)" >>"$GITHUB_OUTPUT"

  mirror:
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker login dhi.io --username "$DHI_USERNAME" --password-stdin <<<"$DHI_TOKEN"
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          go run ./cmd/mirror -latest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: versions
          path: versions/versions.yaml
          if-no-files-found: error

  scenario:
    name: ${{ matrix.scenario }}
    needs: [plan, mirror]
    # Also when mirror was skipped, outside the nightly.
    if: ${{ !failure() && !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # For the merge base with main and main's versions file.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: needs.mirror.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: versions
          path: versions
      - env:
          SCENARIO: ${{ matrix.scenario }}
        run: go run ./e2e "$SCENARIO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.scenario }}
          path: results/
          if-no-files-found: error

  # Also when scenarios failed.
  release:
    needs: [mirror, scenario]
    if: ${{ !cancelled() && needs.mirror.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          go run ./e2e report >report.yaml
          cat report.yaml
          gh release create "nightly-$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" results/versions.yaml report.yaml \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Nightly $(date -u +%F)" --notes "The e2e of $GITHUB_SHA: $RUN"
