name: e2e

# Runs scenarios by hand, each in its own job, in parallel: those of
# e2e/features, each a new three-node k3s cluster, one scenario, then
# always.feature, and those on the runner's own Docker. scenarios picks some
# by their tags; empty runs every scenario. airgap checks the nodes, the
# controller and the fill, install installs k3s and every chart of helm/ on
# empty nodes with ansible/install.yml, and restore starts a clean k3s
# cluster from the cache and deploys the charts with ansible/upgrade.yml. Each job uploads the
# run's files, also when its scenario failed. First, the images job
# publishes the images of e2e/images that the packages do not have yet. When
# restore runs, the cache job builds and publishes the cache when the
# packages do not have it, and restore waits for it; no other scenario does.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario tags, separated by commas; empty for every scenario
        type: string
        default: ""

run-name: e2e${{ inputs.scenarios && format(' of {0}', inputs.scenarios) || '' }}

permissions:
  contents: read

jobs:
  plan:
    name: Pick the scenarios
    runs-on: ubuntu-24.04
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
      restore: ${{ steps.pick.outputs.restore }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        env:
          WANTED: ${{ inputs.scenarios }}
        run: |
          set -euo pipefail
          if [[ -n $WANTED ]]; then
            picked=$(tr -s ', ' '\n' <<<"$WANTED" | sed '/^$/d' | sort -u)
          else
            # airgap, install and restore have no feature file.
            picked=$({ grep -ho '^ *@[a-z0-9-]*' e2e/features/*.feature | tr -d ' @' | grep -vx always && echo airgap && echo install && echo restore; } | sort)
          fi
          # restore runs in its own job, after the cache job.
          restore=false
          if grep -qx restore <<<"$picked"; then
            restore=true
          fi
          scenarios=$({ grep -vx restore <<<"$picked" || true; } | jq -Rnc '[inputs]')
          echo "Scenarios: $scenarios, restore: $restore"
          echo "scenarios=$scenarios" >>"$GITHUB_OUTPUT"
          echo "restore=$restore" >>"$GITHUB_OUTPUT"

  images:
    name: Publish the images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Build and push the missing images
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          go -C e2e run ./cmd/images

  # One cache publisher at a time, across branches: a second one waits,
  # then finds the cache the first pushed under the same tag.
  cache:
    name: Publish the cache
    needs: [plan, images]
    if: needs.plan.outputs.restore == 'true'
    concurrency:
      group: e2e-cache
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: Build and push the cache when it is missing
        run: go -C e2e test -run '^TestScenario$' -count=1 -timeout 50m -v . -scenario cache -push

  # restore pulls the cache the cache job published: -no-build.
  restore:
    name: restore
    needs: cache
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Scenario
        run: go -C e2e test -run '^TestScenario$' -count=1 -timeout 90m -v . -scenario restore -no-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: restore
          path: results/
          if-no-files-found: error

  scenario:
    name: ${{ matrix.scenario }}
    needs: [plan, images]
    if: needs.plan.outputs.scenarios != '[]'
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: go -C e2e test -run '^TestScenario$' -count=1 -timeout 90m -v . -scenario "$SCENARIO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.scenario }}
          path: results/
          if-no-files-found: error
