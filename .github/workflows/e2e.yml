name: e2e

# Runs scenarios of e2e/features by hand, each in its own job, in parallel:
# a new three-node k3s cluster with the charts of helm/ and the versions of
# versions/versions.yaml, one scenario, then always.feature. scenarios picks
# some by their tags; empty runs every scenario. Each job uploads the run's
# files, also when its scenario failed.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario tags, separated by commas; empty for every scenario
        type: string
        default: ""
  # For now: a push run, with every job skipped, lets GitHub start this
  # workflow by hand before it is on main.
  push:
    branches: [work/46-import-run-ci]

run-name: e2e${{ inputs.scenarios && format(' of {0}', inputs.scenarios) || '' }}

permissions:
  contents: read

jobs:
  plan:
    name: Pick the scenarios
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        env:
          WANTED: ${{ inputs.scenarios }}
        run: |
          set -euo pipefail
          if [[ -n $WANTED ]]; then
            picked=$(tr -s ', ' '\n' <<<"$WANTED" | sed '/^$/d' | sort -u)
          else
            picked=$(grep -ho '^ *@[a-z0-9-]*' e2e/features/*.feature | tr -d ' @' | grep -vx always | sort)
          fi
          scenarios=$(jq -Rnc '[inputs]' <<<"$picked")
          echo "Scenarios: $scenarios"
          echo "scenarios=$scenarios" >>"$GITHUB_OUTPUT"

  scenario:
    name: ${{ matrix.scenario }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      # The k3s nodes need br_netfilter and cannot load it themselves.
      - name: Load br_netfilter
        run: sudo modprobe br_netfilter
      - name: Scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: go -C e2e test -run '^TestScenario$' -count=1 -timeout 90m -v . -scenario "$SCENARIO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.scenario }}
          path: results/
          if-no-files-found: error
