name: e2e

# Runs scenarios of e2e/features by hand, each in its own job, in parallel:
# a new three-node k3s cluster with the charts of helm/ and the versions of
# versions/versions.yaml, one scenario, then always.feature. scenarios picks
# some by their tags; empty runs every scenario. The scenario airgap checks
# the nodes, the controller and the fill on the runner's own Docker, and
# restore starts a clean k3s cluster from the cache. Each job uploads the
# run's files, also when its scenario failed. First, the images job
# publishes the images of e2e/images that the packages do not have yet, and
# then the cache job builds and publishes the cache when the packages do not
# have it.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario tags, separated by commas; empty for every scenario
        type: string
        default: ""

run-name: e2e${{ inputs.scenarios && format(' of {0}', inputs.scenarios) || '' }}

permissions:
  contents: read

jobs:
  plan:
    name: Pick the scenarios
    runs-on: ubuntu-24.04
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        env:
          WANTED: ${{ inputs.scenarios }}
        run: |
          set -euo pipefail
          if [[ -n $WANTED ]]; then
            picked=$(tr -s ', ' '\n' <<<"$WANTED" | sed '/^$/d' | sort -u)
          else
            # airgap and restore have no feature file.
            picked=$({ grep -ho '^ *@[a-z0-9-]*' e2e/features/*.feature | tr -d ' @' | grep -vx always && echo airgap && echo restore; } | sort)
          fi
          scenarios=$(jq -Rnc '[inputs]' <<<"$picked")
          echo "Scenarios: $scenarios"
          echo "scenarios=$scenarios" >>"$GITHUB_OUTPUT"

  images:
    name: Publish the images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Build and push the missing images
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          go -C e2e run ./cmd/images

  # One cache publisher at a time, across branches: a second one waits,
  # then finds the cache the first pushed under the same tag.
  cache:
    name: Publish the cache
    needs: images
    concurrency:
      group: e2e-cache
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: Build and push the cache when it is missing
        run: go -C e2e test -run '^TestScenario$' -count=1 -timeout 50m -v . -scenario cache -push

  scenario:
    name: ${{ matrix.scenario }}
    needs: [plan, images, cache]
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        # The cache job published the cache, so restore pulls it.
        run: go -C e2e test -run '^TestScenario$' -count=1 -timeout 90m -v . -scenario "$SCENARIO" -no-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.scenario }}
          path: results/
          if-no-files-found: error
