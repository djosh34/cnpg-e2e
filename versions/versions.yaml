# The two collectors of the cnpg-opentelemetry-collector chart, both the
# opentelemetry-collector chart, on DHI's contrib build. The wrapper
# starts otelcol-k8s, which this image does not have: an empty command.name
# leaves the command out, so the image's own entrypoint, otelcol-contrib,
# runs.
agent:
  command:
    name: ""
  image:
    repository: ghcr.io/djosh34/cnpg-e2e/opentelemetry-collector
    tag: "0.165.0-contrib"
    digest: sha256:8ecab6774570e7a152e5b01c21830c6286c283a55fc3ba75eb12eeeed3fff318
cluster:
  command:
    name: ""
  image:
    repository: ghcr.io/djosh34/cnpg-e2e/opentelemetry-collector
