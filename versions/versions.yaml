# Every version of the system under test that an e2e run uses, and a values
# file of every release. Every chart and every image the charts and the
# cluster run are this repo's packages under ghcr.io/djosh34/cnpg-e2e:
# copies of Docker Hardened Images (DHI), and of the upstream barman-cloud
# chart, which DHI does not have, each image pinned by the digest of its
# linux/amd64 image, not of its index. e2e/cmd/mirror
# copies them by the tags named here and writes the digests it copied. The
# nightly runs it with -latest, which also moves each tag to the newest one
# of its kind, and releases the file it writes.

# The k3s release of the nodes. The playbooks of ansible/ copy its binary,
# its install script and the airgap tarball to every node, and k3s imports
# the tarball's images: those of the release's k3s-images.txt.
k3s:
  version: "v1.37.2+k3s1"
  binary:
    amd64:
      url: https://github.com/k3s-io/k3s/releases/download/v1.37.2%2Bk3s1/k3s
      sha256: 265b3ee6a3198ef14033c63ef46cbb32370d83795199fb6d1b01f21575eddbda
  install:
    url: https://raw.githubusercontent.com/k3s-io/k3s/v1.37.2%2Bk3s1/install.sh
    sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b
  airgap:
    amd64:
      url: https://github.com/k3s-io/k3s/releases/download/v1.37.2%2Bk3s1/k3s-airgap-images-amd64.tar.zst
      sha256: 35a5af1e69b57b8b627a4f6b1c29ea104209b661067b8c97fd40dc3f860bfcd2
  images:
    - docker.io/rancher/klipper-helm:v0.13.3-build20261021
    - docker.io/rancher/klipper-lb:v0.4.17
    - docker.io/rancher/local-path-provisioner:v0.0.37
    - docker.io/rancher/mirrored-coredns-coredns:1.14.7
    - docker.io/rancher/mirrored-library-busybox:1.37.0
    - docker.io/rancher/mirrored-library-traefik:3.7.15
    - docker.io/rancher/mirrored-metrics-server:v0.9.0
    - docker.io/rancher/mirrored-pause:3.10.2
  # k3s's script that makes new CAs, each cross-signed by the old one, of
  # the release. ansible/rotate-ca.yml runs it on the first node.
  rotate-ca:
    url: https://raw.githubusercontent.com/k3s-io/k3s/v1.37.2%2Bk3s1/contrib/util/rotate-default-ca-certs.sh
    sha256: 62ef79f530cd285b3cfce884746abe6c3712ad70d0ef66e81f76aaa93c30551b
  # The release one minor before, which the k3s upgrade scenarios install
  # first: install.yml with k3s_previous=true copies its files.
  previous:
    version: "v1.36.6+k3s1"
    binary:
      amd64:
        url: https://github.com/k3s-io/k3s/releases/download/v1.36.6%2Bk3s1/k3s
        sha256: 66ceb8e67edfa547195135d74783bfadc2ecc04a91059e90ae5f70a3dbc98c15
    install:
      url: https://raw.githubusercontent.com/k3s-io/k3s/v1.36.6%2Bk3s1/install.sh
      sha256: 46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad
    airgap:
      amd64:
        url: https://github.com/k3s-io/k3s/releases/download/v1.36.6%2Bk3s1/k3s-airgap-images-amd64.tar.zst
        sha256: b3029b1a682b8597587e89f5b1c48493e579a6ea1d0ec6a9aac718a8c356e5be

# The SELinux policies that the playbooks install on nodes with selinux on,
# before k3s: container-selinux of Rocky Linux 9.9 and k3s-selinux, which
# needs it. Everything else they need comes with Rocky Linux 9.9.
selinux:
  container-selinux:
    url: https://dl.rockylinux.org/pub/rocky/9.9/AppStream/x86_64/os/Packages/c/container-selinux-2.250.0-1.el9.noarch.rpm
    sha256: 4ceadd241efe441cfae88a517a2e81cff4cb40a1009483ae4a4ee9a411d86873
  k3s-selinux:
    url: https://github.com/k3s-io/k3s-selinux/releases/download/v1.6.stable.1/k3s-selinux-1.6-1.el9.noarch.rpm
    sha256: 23d0095a766b89317d2bdbe8773825987db7221e48743417930a994ca1096793

