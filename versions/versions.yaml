# Every version the cluster runs, and under lab: what the e2e lab runs.
# Every chart and cluster image is a package of ghcr.io/djosh34/cnpg-e2e: a
# copy of a Docker Hardened Image or chart, or of the upstream barman-cloud
# chart, which DHI does not have. Images are pinned by the digest of their
# linux/amd64 image. cmd/mirror copies them by these tags and writes the
# digests; the nightly moves each tag to the newest of its kind.

k3s:
  version: "v1.37.2+k3s1"
  binary:
    url: https://github.com/k3s-io/k3s/releases/download/v1.37.2%2Bk3s1/k3s
    sha256: 265b3ee6a3198ef14033c63ef46cbb32370d83795199fb6d1b01f21575eddbda
  install:
    url: https://raw.githubusercontent.com/k3s-io/k3s/v1.37.2%2Bk3s1/install.sh
    sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b
  airgap:
    url: https://github.com/k3s-io/k3s/releases/download/v1.37.2%2Bk3s1/k3s-airgap-images-amd64.tar.zst
    sha256: 35a5af1e69b57b8b627a4f6b1c29ea104209b661067b8c97fd40dc3f860bfcd2
  # The images in the airgap tarball, which k3s imports.
  images:
    - docker.io/rancher/klipper-helm:v0.13.3-build20261021
    - docker.io/rancher/klipper-lb:v0.4.17
    - docker.io/rancher/local-path-provisioner:v0.0.37
    - docker.io/rancher/mirrored-coredns-coredns:1.14.7
    - docker.io/rancher/mirrored-library-busybox:1.37.0
    - docker.io/rancher/mirrored-library-traefik:3.7.15
    - docker.io/rancher/mirrored-metrics-server:v0.9.0
    - docker.io/rancher/mirrored-pause:3.10.2
  # k3s's script that makes new CAs, for rotate-ca.yml.
  rotate-ca:
    url: https://raw.githubusercontent.com/k3s-io/k3s/v1.37.2%2Bk3s1/contrib/util/rotate-default-ca-certs.sh
    sha256: 62ef79f530cd285b3cfce884746abe6c3712ad70d0ef66e81f76aaa93c30551b
  # The minor before, which the upgrade scenario installs first.
  previous:
    version: "v1.36.6+k3s1"
    binary:
      url: https://github.com/k3s-io/k3s/releases/download/v1.36.6%2Bk3s1/k3s
      sha256: 66ceb8e67edfa547195135d74783bfadc2ecc04a91059e90ae5f70a3dbc98c15
    install:
      url: https://raw.githubusercontent.com/k3s-io/k3s/v1.36.6%2Bk3s1/install.sh
      sha256: 46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad
    airgap:
      url: https://github.com/k3s-io/k3s/releases/download/v1.36.6%2Bk3s1/k3s-airgap-images-amd64.tar.zst
      sha256: b3029b1a682b8597587e89f5b1c48493e579a6ea1d0ec6a9aac718a8c356e5be

