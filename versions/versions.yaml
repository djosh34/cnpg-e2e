# Every version of the system under test that an e2e run uses, and a values
# file of every release. Every chart and every image the charts and the
# cluster run are this repo's packages under ghcr.io/djosh34/cnpg-e2e:
# copies of Docker Hardened Images (DHI), and of the upstream barman-cloud
# chart, which DHI does not have, each pinned by digest. e2e/cmd/mirror
# copies them by the tags named here and writes the digests it copied.

# The k3s release of the nodes. Before k3s starts, each node gets the airgap
# tarball of its architecture, and k3s imports its images: those of the
# release's k3s-images.txt.
k3s:
  version: "v1.37.2+k3s1"
  image: rancher/k3s:v1.37.2-k3s1@sha256:21ea6e0fac4e3930c2ce8aa40ddd41a8b18cb3e9a0222c030dc005e7e88c4332
  airgap:
    amd64:
      url: https://github.com/k3s-io/k3s/releases/download/v1.37.2%2Bk3s1/k3s-airgap-images-amd64.tar.zst
      sha256: 35a5af1e69b57b8b627a4f6b1c29ea104209b661067b8c97fd40dc3f860bfcd2
  images:
    - docker.io/rancher/klipper-helm:v0.13.3-build20261021
    - docker.io/rancher/klipper-lb:v0.4.17
    - docker.io/rancher/local-path-provisioner:v0.0.37
    - docker.io/rancher/mirrored-coredns-coredns:1.14.7
    - docker.io/rancher/mirrored-library-busybox:1.37.0
    - docker.io/rancher/mirrored-library-traefik:3.7.15
    - docker.io/rancher/mirrored-metrics-server:v0.9.0
    - docker.io/rancher/mirrored-pause:3.10.2

# The tools of the e2e image that have to match the cluster: kubectl of the
# k3s release's Kubernetes version, kubectl-cnpg of the operator's version,
# and k3s's script that makes new CAs, of the k3s release.
tools:
  kubectl:
    version: "v1.37.2"
    sha256:
      amd64: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
  kubectl-cnpg:
    version: "1.30.2"
    sha256:
      amd64: a926584a2506f2beff624af03d22eb742d6227e259e364e603ea2f88a791a507
  rotate-default-ca-certs.sh:
    url: https://raw.githubusercontent.com/k3s-io/k3s/v1.37.2%2Bk3s1/contrib/util/rotate-default-ca-certs.sh
    sha256: 62ef79f530cd285b3cfce884746abe6c3712ad70d0ef66e81f76aaa93c30551b

# The charts, as OCI charts, by version and by the digest of their OCI
# manifest. The run writes each into the dependency of its wrapper chart, and
# helm dependency build pulls it. name is the package's chart, and alias the
# wrapper's dependency name, under which its values stay.
charts:
  cert-manager:
    name: cert-manager-chart
    alias: cert-manager
    repository: oci://ghcr.io/djosh34/cnpg-e2e
    version: "1.21.3"
    digest: sha256:d7c2de29812898cd64ca1745628df37b78da74b7e21dfac4e5628b6407235b42
  cloudnative-pg:
    name: cloudnative-pg-chart
    alias: cloudnative-pg
    repository: oci://ghcr.io/djosh34/cnpg-e2e
    version: "0.29.2"
    digest: sha256:9089c1dea04e7b664cb641b26191574fd33900d3ca6fe0790824c3ccff18cdfa
  opentelemetry-collector:
    name: opentelemetry-collector-chart
    alias: opentelemetry-collector
    repository: oci://ghcr.io/djosh34/cnpg-e2e
    version: "0.180.0"
    digest: sha256:6ad21aa35bd7f3c699690656fbde7f5b9845bb7f5d869d593f5f5a8a324b6cb0
  plugin-barman-cloud:
    name: plugin-barman-cloud
    alias: plugin-barman-cloud
    repository: oci://ghcr.io/djosh34/cnpg-e2e
    version: "0.9.0"
    digest: sha256:d34ada2eedffaee9153c6ae31e0e5b93fd28765cc8fba7c5fb45d4ed6b60df1a

# The registry of the nodes, CNCF Distribution v3, which also takes the
# images the fill copies in, and the pause image of the prepull.
registry:
  image: ghcr.io/djosh34/cnpg-e2e/distribution-registry:3.1.2@sha256:10e21241a861d8f96af3423bbae69c16d57ff9fa17cb42706fb1f212de79eb43
prepull:
  image: ghcr.io/djosh34/cnpg-e2e/kubernetes-pause:3.10.2@sha256:19906bc2350b1f030e4803b58de88198d43e79394e99c7d34463c9aaead13521

# The instance images, which the cnpg-cluster charts read. The rollout
# scenario starts on rolloutFrom, an older build, and rolls out to
# imageName. Both name postgres 70, so the cluster gets that uid and gid.
postgresql:
  imageName: ghcr.io/djosh34/cnpg-e2e/postgres:18.7-debian13@sha256:c10fed18bc412ce45b7381ef13b40bc3f4461b84a73d7766ce82b260413dc69b
  rolloutFrom: ghcr.io/djosh34/cnpg-e2e/postgres:18.6-debian13@sha256:a52ca74a5c7da183e0fb7e089d666375d8916855df375268ccb4ed691c85746c
  postgresUID: 70
  postgresGID: 70

