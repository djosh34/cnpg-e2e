# Rotates the CAs that k3s made itself, as docs.k3s.io says. On the first
# node, k3s's rotate-default-ca-certs.sh makes a new CA for each of k3s's
# own, cross-signed by the old one, and k3s certificate rotate-ca stores
# them in etcd. Then k3s restarts on one node at a time, through the k3s
# role, and each node makes its certificates from the new CAs. The pods keep
# running. Nothing else changes: no chart is applied.
#
#   ansible-playbook rotate-ca.yml
#
# Every run rotates the CAs again.
- name: Download
  ansible.builtin.import_playbook: download.yml

- name: Download the CA script
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the versions file
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../versions/versions.yaml"
        name: versions

    - name: Download rotate-default-ca-certs.sh
      ansible.builtin.get_url:
        url: "{{ versions.k3s['rotate-ca'].url }}"
        dest: "{{ playbook_dir }}/downloads/k3s-rotate-ca.sh"
        checksum: "sha256:{{ versions.k3s['rotate-ca'].sha256 }}"
        mode: "0644"

- name: Store new CAs in etcd
  hosts: nodes[0]
  vars:
    staged: /var/lib/rancher/k3s/server/rotate-ca
  tasks:
    - name: Copy rotate-default-ca-certs.sh
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/downloads/k3s-rotate-ca.sh"
        dest: /usr/local/bin/k3s-rotate-ca.sh
        mode: "0755"

    # From a staged directory of a run that stopped before its end too.
    - name: Remove a staged directory
      ansible.builtin.file:
        path: "{{ staged }}"
        state: absent

    # It reads the CAs and their keys from k3s's server directory and
    # writes the new ones next to it, in rotate-ca.
    - name: Make new CAs, each cross-signed by the old one
      ansible.builtin.command: /usr/local/bin/k3s-rotate-ca.sh
      changed_when: true
      no_log: true

    - name: Store the new CAs in etcd
      ansible.builtin.command: k3s certificate rotate-ca --path={{ staged }}
      changed_when: true

    # The new keys are in etcd and, after the restart, in k3s's server
    # directory.
    - name: Remove the staged directory
      ansible.builtin.file:
        path: "{{ staged }}"
        state: absent

- name: Restart k3s on the new CAs
  hosts: nodes
  serial: 1
  pre_tasks:
    # rotate-ca leaves this mark only on the node it ran on. Without it, a
    # node keeps the serving certificate of the old CA and can write it back
    # into the k3s-serving Secret that every server serves.
    - name: Have k3s sign its serving certificate again at its restart
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/tls/dynamic-cert-regenerate
        state: touch
        mode: "0600"
  roles:
    - role: k3s
      vars:
        k3s_restart: true
