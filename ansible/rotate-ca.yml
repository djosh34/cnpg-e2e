# Rotates the CAs that k3s made itself, as docs.k3s.io says: k3s's script
# makes a new CA for each, cross-signed by the old one, and k3s stores them
# in etcd. Then k3s restarts on one node at a time and makes the node's
# certificates from the new CAs. The pods keep running. Every run rotates
# again.
#
#   ansible-playbook rotate-ca.yml
- name: Store new CAs in etcd
  hosts: nodes[0]
  vars:
    staged: /var/lib/rancher/k3s/server/rotate-ca
  tasks:
    - name: Copy rotate-default-ca-certs.sh
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/k3s-rotate-ca.sh"
        dest: /usr/local/bin/k3s-rotate-ca.sh
        mode: "0755"

    # Also one a run left when it stopped before its end.
    - name: Remove a staged directory
      ansible.builtin.file:
        path: "{{ staged }}"
        state: absent

    - name: Make new CAs, each cross-signed by the old one
      ansible.builtin.command: /usr/local/bin/k3s-rotate-ca.sh
      changed_when: true
      no_log: true

    - name: Store the new CAs in etcd
      ansible.builtin.command: k3s certificate rotate-ca --path={{ staged }}
      changed_when: true

    - name: Remove the staged directory
      ansible.builtin.file:
        path: "{{ staged }}"
        state: absent

- name: Restart k3s on the new CAs
  hosts: nodes
  serial: 1
  pre_tasks:
    # rotate-ca leaves this mark only on the node it ran on. Without it, a
    # node keeps its serving certificate of the old CA.
    - name: Have k3s sign its serving certificate again at its restart
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/tls/dynamic-cert-regenerate
        state: touch
        mode: "0600"
  roles:
    - role: k3s
      vars:
        k3s_restart: true
