# The k3s settings of every node, as /etc/rancher/k3s/config.yaml. The k3s
# role adds each node's own: its address, the join, the DNS server and
# selinux.

# Secrets are encrypted before they reach etcd.
secrets-encryption: true

# kube-proxy cannot set nf_conntrack_max inside a container.
kube-proxy-arg:
  - conntrack-max-per-core=0
