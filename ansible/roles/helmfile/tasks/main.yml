# Copies helm, its diff plugin and helmfile to every node, then the charts
# and the versions file to the first node, where helmfile applies them.

- name: Copy helm and helmfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/{{ item }}"
    dest: /usr/local/bin/
    mode: "0755"
  loop: [helm/linux-amd64/helm, helmfile/helmfile]

- name: Make helm's plugin directory
  ansible.builtin.file:
    path: /root/.local/share/helm/plugins
    state: directory
    mode: "0755"

- name: Copy helm's diff plugin
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/helm-diff/diff"
    dest: /root/.local/share/helm/plugins/
    mode: preserve

# helm/ and the versions file, as fill packed them. A new archive replaces
# the old directory, so nothing removed from helm/ stays on the node.
- name: Copy the charts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/helm.tar"
    dest: /opt/helm.tar
    mode: "0644"
  register: charts
  run_once: true

- name: Remove the charts of before
  ansible.builtin.file:
    path: /opt/deploy
    state: absent
  when: charts is changed
  run_once: true

- name: Make the directory of the charts
  ansible.builtin.file:
    path: /opt/deploy
    state: directory
    mode: "0755"
  run_once: true

- name: Unpack the charts
  ansible.builtin.unarchive:
    src: /opt/helm.tar
    dest: /opt/deploy
    remote_src: true
  when: charts is changed
  run_once: true

- name: Check that every secret is set
  ansible.builtin.assert:
    that: missing | length == 0
    fail_msg: "Not set in the environment: {{ missing | join(', ') }}"
    quiet: true
  vars:
    missing: "{{ secrets | zip(query('ansible.builtin.env', *secrets)) | selectattr('1', 'equalto', '') | map(attribute='0') | list }}"
  run_once: true

- name: Look for the registry
  ansible.builtin.command: k3s kubectl --namespace registry get daemonset registry --ignore-not-found --output name
  register: registry
  changed_when: false
  run_once: true

# no_log keeps the secrets out of the output, unless Ansible runs with -vvv:
# never run it so. helmfile writes the values for helm under TMPDIR, on a
# tmpfs only root reads. It exits with 2 when it changed a release.
- name: Apply every chart
  ansible.builtin.shell: |
    set -eu
    umask 077
    mkdir -p /run/helmfile
    TMPDIR=/run/helmfile helmfile --file helmfile.yaml.gotmpl --no-color apply --skip-deps --skip-diff-on-install --suppress-secrets --detailed-exitcode
  args:
    chdir: /opt/deploy/helm
  environment: "{{ dict(secrets | zip(query('ansible.builtin.env', *secrets))) | combine(fixed) }}"
  vars:
    fixed:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      HELMFILE_UPGRADE_NOTICE_DISABLED: "1"
      REGISTRY_PRESENT: "{{ (registry.stdout | length > 0) | string | lower }}"
      PG_RESTORE: "{{ pg_restore | bool | string | lower }}"
  register: apply
  no_log: true
  failed_when: apply.rc not in [0, 2]
  changed_when: apply.rc == 2
  run_once: true
