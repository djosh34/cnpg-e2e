# Copies helm/ and the versions file of the checkout and the upstream charts
# to the node, then runs one helmfile apply of every chart, with the
# registry's order when the registry is not there yet.

- name: Make the directories of helmfile
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deploy_dir }}/helm/upstream"
    - "{{ deploy_dir }}/versions"

- name: Read the versions file
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../versions/versions.yaml"
    name: versions

# So a path gone from the checkout, such as a chart's template, is gone on
# the node too, and a running cluster gets what a new one gets: helm/ of
# the checkout and the upstream charts of the versions file, each a file or
# a directory as there. Before the copy, so a file that became a directory,
# or the other way round, is out of its way.
- name: List helm/ on the controller
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../helm"
    recurse: true
    hidden: true
    file_type: any
  delegate_to: localhost
  register: checkout

- name: List helm/ on the node
  ansible.builtin.find:
    paths: "{{ deploy_dir }}/helm"
    recurse: true
    hidden: true
    file_type: any
  register: node

- name: Remove what the checkout does not have
  ansible.builtin.file:
    path: "{{ deploy_dir }}/helm/{{ item }}"
    state: absent
  loop: "{{ have | difference(want) }}"
  vars:
    # A directory with a / at its end.
    have: >-
      {{ node.files | selectattr('isdir') | map(attribute='path') | map('relpath', deploy_dir ~ '/helm') | map('regex_replace', '$', '/') | list
         + node.files | rejectattr('isdir') | map(attribute='path') | map('relpath', deploy_dir ~ '/helm') | list }}
    want: >-
      {{ checkout.files | selectattr('isdir') | map(attribute='path') | map('relpath', playbook_dir ~ '/../helm') | map('regex_replace', '$', '/') | list
         + checkout.files | rejectattr('isdir') | map(attribute='path') | map('relpath', playbook_dir ~ '/../helm') | list
         + ['upstream/'] + versions.charts.keys() | map('regex_replace', '^', 'upstream/') | map('regex_replace', '$', '.tgz') | list }}

- name: Copy the charts and their values
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../helm/"
    dest: "{{ deploy_dir }}/helm/"
    mode: "0644"
    directory_mode: "0755"

- name: Copy the upstream charts
  ansible.builtin.copy:
    src: "{{ downloads }}/charts/{{ item }}.tgz"
    dest: "{{ deploy_dir }}/helm/upstream/{{ item }}.tgz"
    mode: "0644"
  loop: "{{ versions.charts.keys() | list }}"

- name: Copy the versions file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../versions/versions.yaml"
    dest: "{{ deploy_dir }}/versions/versions.yaml"
    mode: "0644"

# An error of the API fails the task: it never counts as no registry.
- name: Look for the registry
  ansible.builtin.command: k3s kubectl --namespace registry get daemonset registry --ignore-not-found --output name
  register: registry
  changed_when: false

# no_log keeps the environment and helmfile's output, which shows values,
# out of Ansible's output. helmfile writes the values, secrets included, to
# files for helm, under TMPDIR: a directory of /run, a tmpfs, that only root
# can read, and it deletes them after each helm call. It exits with 2 when it
# changed a release.
- name: Apply every chart
  ansible.builtin.shell: |
    set -eu
    umask 077
    mkdir -p /run/helmfile
    TMPDIR=/run/helmfile helmfile --file helmfile.yaml.gotmpl --no-color apply --skip-diff-on-install --suppress-secrets --detailed-exitcode
  args:
    chdir: "{{ deploy_dir }}/helm"
  environment: "{{ dict(helmfile_env | zip(query('ansible.builtin.env', *helmfile_env))) | combine(fixed) }}"
  vars:
    fixed:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      HELMFILE_UPGRADE_NOTICE_DISABLED: "1"
      REGISTRY_PRESENT: "{{ (registry.stdout | length > 0) | string | lower }}"
  register: apply
  no_log: true
  failed_when: apply.rc not in [0, 2]
  changed_when: apply.rc == 2
