# true adds pg-restore, a second cluster restored from pg's backups. A later
# run without it leaves pg-restore as it is.
pg_restore: false

# The company CA and the charts' secrets, from the controller's environment.
# Ansible puts them on the command line over SSH, so they never land on a
# disk, though ps shows them while helmfile runs.
secrets: >-
  {{ ['COMPANY_CA', 'REGISTRY_HTTP_SECRET', 'REGISTRY_S3_ACCESS_KEY', 'REGISTRY_S3_SECRET_KEY',
      'BACKUP_S3_ACCESS_KEY', 'BACKUP_S3_SECRET_KEY', 'PG_SERVER_EAB_KID', 'PG_SERVER_EAB_HMAC',
      'PG_REPLICATION_EAB_KID', 'PG_REPLICATION_EAB_HMAC', 'OTEL_CLIENT_EAB_KID', 'OTEL_CLIENT_EAB_HMAC']
     + (['PG_RESTORE_SERVER_EAB_KID', 'PG_RESTORE_SERVER_EAB_HMAC', 'PG_RESTORE_REPLICATION_EAB_KID',
         'PG_RESTORE_REPLICATION_EAB_HMAC'] if pg_restore | bool else []) }}
