# Copies k3s, its config and its images to the node and starts k3s, or
# restarts it when the binary or a file it reads at start changed.

- name: Read whether SELinux enforces on the node
  ansible.builtin.slurp:
    src: /sys/fs/selinux/enforce
  register: enforce
  failed_when: false

- name: Check that selinux matches the node
  ansible.builtin.assert:
    that: (enforce.content | default('') | b64decode | trim == '1') == (selinux | bool)
    fail_msg: selinux is {{ selinux }}, but SELinux {{ 'does not enforce' if selinux | bool else 'enforces' }} on the node

# The policies go first, so what the tasks below put into k3s's
# directories gets their labels. The nodes have no repository; fill checked
# each rpm's sha256.
- name: Copy the SELinux policies
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/{{ item }}.rpm"
    dest: /var/cache/k3s-selinux/
    mode: "0644"
  loop: [container-selinux, k3s-selinux]
  when: selinux | bool

- name: Install the SELinux policies
  ansible.builtin.dnf:
    name:
      - /var/cache/k3s-selinux/container-selinux.rpm
      - /var/cache/k3s-selinux/k3s-selinux.rpm
    disablerepo: "*"
    disable_gpg_check: true
    state: present
  when: selinux | bool

- name: Make the directories of k3s
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/rancher/k3s, mode: "0755" }
    - { path: /var/lib/rancher/k3s/server, mode: "0700" }
    - { path: /var/lib/rancher/k3s/server/manifests, mode: "0700" }
    - { path: /var/lib/rancher/k3s/agent/images, mode: "0755" }

- name: Copy the k3s binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/k3s"
    dest: /usr/local/bin/k3s
    mode: "0755"
  register: k3s_binary

- name: Copy the install script of k3s
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/k3s-install.sh"
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
  register: k3s_install

# k3s imports both at start: its own images, and the registry's, which no
# registry can serve before it runs.
- name: Copy the airgap images and the registry's image
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/{{ item }}"
    dest: /var/lib/rancher/k3s/agent/images/
    mode: "0644"
  loop: [k3s-airgap-images-amd64.tar.zst, registry.tar]

- name: Read the cluster's token from the first node
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/token
  delegate_to: "{{ groups['nodes'][0] }}"
  register: k3s_token
  no_log: true
  when: inventory_hostname != groups['nodes'][0]

# k3s/config.yaml, and this node's own settings.
- name: Write config.yaml
  ansible.builtin.copy:
    content: "{{ shared | combine(own, join, dns, enforcing) | to_nice_yaml(indent=2) }}"
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  vars:
    first: "{{ groups['nodes'][0] }}"
    shared: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/k3s/config.yaml') | from_yaml }}"
    own:
      node-ip: "{{ ansible_default_ipv4.address }}"
    join: >-
      {{ {'cluster-init': true} if inventory_hostname == first else
         {'server': 'https://' ~ hostvars[first].ansible_default_ipv4.address ~ ':6443',
          'token': k3s_token.content | b64decode | trim} }}
    dns: "{{ {'resolv-conf': '/etc/rancher/k3s/resolv.conf'} if dns_server else {} }}"
    enforcing: "{{ {'selinux': true} if selinux | bool else {} }}"
  register: k3s_config
  no_log: true

- name: Write registries.yaml, which sends every pull from ghcr.io to the registry on this node
  ansible.builtin.copy:
    content: |
      mirrors:
        ghcr.io:
          endpoint:
            - http://{{ ansible_default_ipv4.address }}:5000
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0644"
  register: k3s_registries

- name: Write the DNS server of k3s and its pods
  ansible.builtin.copy:
    content: "nameserver {{ dns_server }}\n"
    dest: /etc/rancher/k3s/resolv.conf
    mode: "0644"
  when: dns_server | length > 0
  register: k3s_resolv

- name: Copy the manifests k3s applies
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/k3s/manifests/"
    dest: /var/lib/rancher/k3s/server/manifests/
    mode: "0600"

- name: Look for the systemd unit of k3s and its environment file
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: &unit_files
    - /etc/systemd/system/k3s.service
    - /etc/systemd/system/k3s.service.env
  register: k3s_unit

- name: Install the systemd unit of k3s
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_SKIP_DOWNLOAD: "true"
    INSTALL_K3S_SKIP_START: "true"
  when: k3s_install is changed or not k3s_unit.results[0].stat.exists

# A new install script can write the same files, which need no restart.
- name: Look at the systemd unit of k3s and its environment file again
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: *unit_files
  register: k3s_unit_now

# k3s is ready only once its etcd member is a voter, so the next node joins after.
- name: Start k3s, or restart it when it changed
  ansible.builtin.systemd_service:
    name: k3s
    state: "{{ 'restarted' if restart else 'started' }}"
    enabled: true
  vars:
    restart: >-
      {{ k3s_restart | bool or k3s_binary is changed or k3s_config is changed or k3s_registries is changed or k3s_resolv is changed
         or k3s_unit.results | map(attribute='stat.checksum', default='') | list
            != k3s_unit_now.results | map(attribute='stat.checksum', default='') | list }}

# One CoreDNS per node, so a lost node takes no name lookups with it. k3s
# makes the Deployment a little after it starts and never resets replicas.
- name: Look at the number of CoreDNS pods
  ansible.builtin.command: k3s kubectl --namespace kube-system get deployment coredns --output jsonpath={.spec.replicas}
  register: coredns
  until: coredns is succeeded
  retries: 60
  delay: 5
  changed_when: false
  when: inventory_hostname == groups['nodes'][-1]

- name: Run one CoreDNS pod per node
  ansible.builtin.command: k3s kubectl --namespace kube-system scale deployment coredns --replicas {{ groups['nodes'] | length }}
  changed_when: true
  when: inventory_hostname == groups['nodes'][-1] and coredns.stdout != groups['nodes'] | length | string
