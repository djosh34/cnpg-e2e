# Where download.yml put the files on the controller.
downloads: "{{ playbook_dir }}/downloads"

# The DNS server of k3s and its pods. Empty: the node's own
# /etc/resolv.conf.
dns_server: ""

# true for nodes with SELinux enforcing, Rocky Linux 9.9 machines, which
# have every other package the SELinux policies need: the role installs the
# policies of the versions file before k3s and turns on SELinux in k3s's
# config. Set it for the whole group nodes: download.yml reads it from the
# first node.
selinux: false

# true restarts k3s on each node even when nothing changed, as rotate-ca.yml
# needs, so the node makes its certificates from the new CAs.
k3s_restart: false
