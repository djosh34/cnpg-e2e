# Where download.yml put the files on the controller.
downloads: "{{ playbook_dir }}/downloads"

# The DNS server of k3s and its pods. Empty: the node's own
# /etc/resolv.conf.
dns_server: ""

# true for nodes with SELinux enforcing, such as Rocky Linux 9 machines:
# the role installs the SELinux policies of the versions file before k3s and
# turns on SELinux in k3s's config. Set it for the whole group nodes:
# download.yml reads it from the first node.
selinux: false
