# Installs or upgrades k3s on the nodes, one at a time, then applies every
# chart with helmfile from the first node. A second run changes nothing. It
# copies only what cmd/fill put into files/.
#
#   ansible-playbook install.yml
#
# The inventory sets selinux=true or false for the nodes, and the
# environment holds the charts' secrets: see roles/helmfile.
- name: k3s
  hosts: nodes
  serial: 1
  roles: [k3s]

- name: Charts
  hosts: nodes
  roles: [helmfile]
