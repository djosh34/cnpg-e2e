# The values of one CNPG cluster for charts/cnpg-cluster. The names below are
# examples. No read LoadBalancer.

cluster:
  name: pg
  namespace: databases
  instances: 3

# The Secret the chart makes with ca.crt: the CAs that may sign client
# certificates, including the CA of the chart's issuers, since the chart also
# uses it as the server CA. No ca.key.
caSecret: client-ca

# rw LoadBalancer for clients, on 5432 of every node. The NetworkPolicy admits the svclb pods that k3s servicelb runs on every node to forward its port.
# null: no LoadBalancer, as for a second cluster, since one port of the nodes
# serves one cluster.
rwLoadBalancer:
  name: pg-rw-lb

# Who may reach the instance pods besides clients: the operator on 8000, the
# OTel collectors on 9187.
network:
  operatorNamespace: cnpg-system
  otelNamespace: otel
  # The pod range of the cluster, k3s's default cluster-cidr: a /16, of
  # which each node gets a /24.
  podCIDR: 10.42.0.0/16

# CN and dnsNames of the server certificate and of the one replication
# certificate shared by all instances, both signed by the CA of the chart's
# issuers. The CN is the host name of one node. pg_ident maps this CN, and
# besides CNPG's fixed CN streaming_replica only this CN, to streaming_replica.
replication:
  commonName: node-1.example.test
  dnsNames: [pg-rw, pg-rw.databases.svc]

# One database per entry, owned by one LOGIN role with no password. A client
# certificate with one of clientCNs logs in as that role, to that database only.
databases:
  - name: orders
    role: orders
    clientCNs: [orders-app.test]
  - name: billing
    role: billing
    clientCNs: [billing-app.test, billing-report.test]
