{{- $c := .Values.cluster }}
# The CAs that may sign client certificates, which CNPG also uses as the
# server CA.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.caSecret }}
  namespace: {{ $c.namespace }}
stringData:
  ca.crt: {{ required "ca is required" .Values.ca | quote }}
---
# The keys of the object store.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.objectStore.credentialsSecret }}
  namespace: {{ $c.namespace }}
stringData:
  ACCESS_KEY_ID: {{ required "objectStore.accessKeyID is required" .Values.objectStore.accessKeyID | quote }}
  ACCESS_SECRET_KEY: {{ required "objectStore.secretAccessKey is required" .Values.objectStore.secretAccessKey | quote }}
