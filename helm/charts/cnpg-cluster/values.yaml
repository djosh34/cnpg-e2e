# Chart-only settings. The cluster, CA Secret, LoadBalancer, namespaces,
# replication and databases come from values/cluster.yaml. The values below are
# examples.

# The instance image, by tag and digest. The e2e run sets it from the
# manifest's postgresql.imageName (versions/).
postgresql:
  imageName: ""

cluster:
  # The uid and gid the image names postgres. The e2e run sets them from
  # postgresql.postgresUID and postgresGID of the versions file. CNPG writes
  # the name of its uid into pg_ident. Set them when the cluster is created.
  postgresUID: 999
  postgresGID: 999
  # The data volume of each instance. CNPG has no default size.
  storageSize: 50Gi
  # The size of each WAL file in MB, set only when the cluster is created.
  # With 1 MB files a quiet cluster writes about 288 MiB of WAL a day instead
  # of 4.5 GiB.
  walSegmentSize: 1

# The CAs, PEM, that may sign client certificates, in the Secret caSecret,
# which CNPG also uses as the server CA: the CA of the issuers below.
ca: ""

# The ACME CA that issues the server and replication certificates. Each
# Certificate gets its own Issuer and ACME account, with its own EAB key of
# the ACME CA: the Issuer <cluster>-server with eab.server, and
# <cluster>-replication with eab.replication. ca is the CA, PEM, that signs
# the ACME server's certificate; empty when that certificate is publicly
# trusted.
acme:
  server: https://acme.example.com/directory
  ca: ""
  eab:
    server: {keyID: "", hmac: ""}
    replication: {keyID: "", hmac: ""}
  # The http-01 challenges go through this ingress class: k3s's Traefik, on
  # port 80 of every node.
  ingressClassName: traefik

# barman-cloud object store for WAL archive and backups.
objectStore:
  destinationPath: s3://example-bucket/
  endpointURL: https://s3.example.com
  # The keys of the object store, which the chart puts into the Secret
  # credentialsSecret.
  credentialsSecret: backup-creds
  accessKeyID: ""
  secretAccessKey: ""
  # The Secret and key with the CA that signed the store's certificate, as
  # {name, key}. Empty when the store's certificate is publicly trusted.
  endpointCA: {}
  # A call to a store that accepts connections and never answers gives up
  # after 5 s, with one attempt, instead of 60 s and 5 attempts.
  readTimeout: 5  # --read-timeout of every WAL archive and restore call
  maxAttempts: 1  # AWS_MAX_ATTEMPTS in the plugin's sidecar

# When the daily base backup runs, as CNPG's six-field cron schedule. A new
# cluster also takes one at once.
backupSchedule: "0 0 3 * * *"

# true: bootstrap by restoring the backups of sourceCluster instead of initdb.
recovery:
  enabled: false
  sourceCluster: pg  # cluster name the backups were taken from

# Set in values/cluster.yaml.
replication: {}
databases: []
