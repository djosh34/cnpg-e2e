cloudnative-pg-chart:
  # One operator per node. They elect a leader; when its node is lost,
  # another takes over within about 20 s.
  replicaCount: 3
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
  # With a pod on every node, an extra pod has nowhere to go.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
