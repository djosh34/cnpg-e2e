# Distribution's config: read-only on the bucket, so it never writes, also
# not by its upload purging, and no redirects, so a node never needs the
# store.
apiVersion: v1
kind: Secret
metadata:
  name: registry
  namespace: {{ .Release.Namespace }}
stringData:
  config.yml: |
    version: 0.1
    storage:
      s3:
        accesskey: {{ required "s3.accessKey is required" .Values.s3.accessKey | quote }}
        secretkey: {{ required "s3.secretKey is required" .Values.s3.secretKey | quote }}
        region: {{ .Values.s3.region | quote }}
        regionendpoint: {{ .Values.s3.endpoint | quote }}
        forcepathstyle: true
        bucket: {{ .Values.s3.bucket | quote }}
      redirect:
        disable: true
      maintenance:
        readonly:
          enabled: true
        uploadpurging:
          enabled: false
    http:
      addr: :5000
      secret: {{ required "httpSecret is required" .Values.httpSecret | quote }}
  {{- with .Values.ca }}
  ca.crt: {{ . | quote }}
  {{- end }}
